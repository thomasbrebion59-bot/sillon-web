<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sillon · avatars</title><style>/* ————— Avatars dessinés (v3) : disque de nuit, trait lumineux, étincelle, habillage ————— */
.avatar.av {
  position: relative; overflow: visible; padding: 0; font-size: 0;
  background:
    radial-gradient(circle at 50% 44%, rgba(var(--av-rgb), var(--av-bg, .26)) 0%, rgba(var(--av-rgb), .07) 46%, transparent 68%),
    radial-gradient(circle at 50% 38%, #141844 0%, #0A0C26 58%, #05060F 100%);
  box-shadow: inset 0 0 0 1px rgba(var(--av-rgb), .2), var(--av-drop);
}
/* Mode clair : le disque reste un objet de nuit, posé sans ombre portée, avec un liseré fin */
:root { --av-drop: 0 0 0 1px rgba(30, 40, 90, .15); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --av-drop: 0 1px 3px rgba(0, 0, 0, .25); } }
:root[data-theme="dark"] { --av-drop: 0 1px 3px rgba(0, 0, 0, .25); }
.avatar.xs { width: 30px; height: 30px; }
.avatar.av-big { width: 52px; height: 52px; }

.av-fig { transform-origin: 32px 32px; }

.avatar.av:not(.lg):not(.xl) .av-fig { transform: scale(1.12); }
.avatar.av.ser-t:not(.lg):not(.xl) .av-line { stroke-width: 2.1px; }
.avatar.av.ser-r:not(.lg):not(.xl) .av-line { stroke-width: 2.7px; }
.avatar.av:not(.lg):not(.xl) .av-line.faint, .avatar.av:not(.lg):not(.xl) .n2 { display: none; }
.avatar.av:not(.lg):not(.xl) .av-glow { opacity: .09; }
/* Sous 36 px (liste des profils, messages) : plus de détails ni de particules, un trait d'au moins 1,5 px à l'écran */
.avatar.av.xs .av-fig { transform: scale(1.16); }
.avatar.av.xs.ser-t .av-line { stroke-width: 3.1px; }
.avatar.av.xs.ser-r .av-line { stroke-width: 3.4px; }
.avatar.av.xs .av-glow, .avatar.av.xs .av-ng:not(.key), .avatar.av.xs .av-nc:not(.key) { display: none; }
.avatar.av.xs .av-nc.key { r: 2.6px; }
.av-line { fill: none; stroke: var(--av); stroke-linecap: round; stroke-linejoin: round; }
.av-line.faint { opacity: .55; }
.av-glow { fill: none; stroke: var(--av); stroke-linecap: round; stroke-linejoin: round; opacity: .12; }

.ser-r .av-fill path { opacity: .17; }
.av-fill path.hot { opacity: .62; fill: color-mix(in oklab, var(--av) 55%, #fff); }
.av-nc { fill: color-mix(in oklab, var(--av) 78%, #fff); }
.av-nc.key { fill: color-mix(in oklab, var(--av) 25%, #fff); }
.av-ng { fill: var(--av); opacity: .1; }
.av-ng.key { opacity: .22; }
.av-spark { fill: none; stroke: color-mix(in oklab, var(--av) 30%, #fff); stroke-linecap: round; stroke-dasharray: 7 93; stroke-dashoffset: 100; opacity: 0; }
.av-seg { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 1.5; stroke-linecap: round; }
.av-seg.on { stroke: var(--av); opacity: .9; }
.av-full { fill: none; stroke: var(--av); stroke-width: 1.3; opacity: .85; }
.av-cn { fill: #fff; stroke: var(--av); stroke-width: .6; }
.av-cb { fill: #0A0C26; }
/* Petites tailles : une jauge (piste complète, puis l'arc rempli), pas un indicateur de chargement */
.av-track, .av-prog { display: none; fill: none; stroke-width: 1.7; }
.av-track { stroke: rgba(var(--av-rgb), .18); }
.av-prog { stroke: var(--av); stroke-linecap: round; opacity: .9; }
.avatar.av:not(.lg):not(.xl) .av-seg { display: none; }
.avatar.av:not(.lg):not(.xl) .av-prog, .avatar.av:not(.lg):not(.xl) .av-track { display: inline; }
/* Avec le liseré du halo, la jauge s'allège pour ne pas faire un second anneau */
.avatar.av.st2:not(.lg):not(.xl) .av-track, .avatar.av.st3:not(.lg):not(.xl) .av-track { display: none; }
.avatar.av.st2:not(.lg):not(.xl) .av-prog, .avatar.av.st3:not(.lg):not(.xl) .av-prog { opacity: .55; stroke-width: 1.4; }

.av-orb .av-orb-g { fill: var(--av); opacity: .45; }

/* Paliers d'habillage (décor, jamais retiré), un signe distinct chacun :
   Tracé = trait un peu retenu, nœuds de la couleur · Lueur = nœuds blancs, fond qui s'éclaire ·
   Halo = liseré plein qui respire · Orbite = un satellite · Couronne = une étoile, un trait plus vif */
.av.st0 .av-line:not(.faint) { opacity: .78; }
.av.st0 .av-nc.key { fill: color-mix(in oklab, var(--av) 55%, #fff); }
.av.st1, .av.st2, .av.st3, .av.st4 { --av-bg: .42; }
.av.st1 .av-nc, .av.st2 .av-nc, .av.st3 .av-nc, .av.st4 .av-nc { fill: #fff; }
.av.st1 .av-glow, .av.st2 .av-glow, .av.st3 .av-glow, .av.st4 .av-glow { opacity: .32; }
.av.st2, .av.st3, .av.st4 { box-shadow: inset 0 0 0 1.5px rgba(var(--av-rgb), .85), 0 0 16px rgba(var(--av-rgb), .4); }
.av.st4 .av-line:not(.faint) { stroke: color-mix(in oklab, var(--av) 72%, #fff); }
.av.st4 .av-glow { opacity: .42; }

/* Vie : les nœuds battent, l'étincelle parcourt le tracé, le halo respire */
@keyframes av-pulse { 0%, 100% { opacity: .06; } 50% { opacity: .2; } }
@keyframes av-pulse-k { 0%, 100% { opacity: .16; } 50% { opacity: .42; } }
@keyframes av-run { 0% { stroke-dashoffset: 100; opacity: 0; } 4% { opacity: 1; } 46% { opacity: 1; } 52% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes av-run1 { 0% { stroke-dashoffset: 100; opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes av-breathe { 0%, 100% { box-shadow: inset 0 0 0 1.5px rgba(var(--av-rgb), .75), 0 0 10px rgba(var(--av-rgb), .26); } 50% { box-shadow: inset 0 0 0 1.5px rgba(var(--av-rgb), .95), 0 0 20px rgba(var(--av-rgb), .48); } }
@keyframes av-turn { to { transform: rotate(360deg); } }
@keyframes av-flare { 0% { opacity: .2; } 22% { opacity: .75; } 100% { opacity: .2; } }
@keyframes av-ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.55); opacity: 0; } }
@keyframes av-ring-s { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.32); opacity: 0; } }
@keyframes av-core { 0% { opacity: .2; } 20% { opacity: .9; } 100% { opacity: .2; } }
.av-ng { animation: av-pulse 3.4s ease-in-out infinite; }
.av-ng.key { animation-name: av-pulse-k; }
.av-spark { animation: av-run 7s cubic-bezier(.45, 0, .3, 1) infinite; animation-delay: var(--av-d, 0s); }
.av.st2, .av.st3, .av.st4 { animation: av-breathe 5.2s ease-in-out infinite; }
.av-orb { animation: av-turn 22s linear infinite; }

/* Réaction : il s'allume quand on termine un exercice */
.av::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 46%, rgba(var(--av-rgb), .7), rgba(var(--av-rgb), .18) 52%, transparent 72%); opacity: 0; pointer-events: none; }
.av.av-on::before { animation: av-bloom 1.5s cubic-bezier(.2, .7, .3, 1) 1; }
@keyframes av-bloom { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }
html[data-motion="minimales"] .av.av-on::before { opacity: .6; }
.av::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--av), 0 0 18px rgba(var(--av-rgb), .6); opacity: 0; pointer-events: none; }
.av.av-on::after { animation: av-ring 1.1s cubic-bezier(.2, .7, .3, 1) 1; }
.av.av-on .av-glow { animation: av-flare 1.8s ease-out 1; }
.av.av-on .av-ng { animation: av-core 1.8s ease-out 1; }
.av.av-on .av-spark { animation: av-run1 1.25s cubic-bezier(.3, 0, .2, 1) 1; }
.av.av-on .av-nc { fill: #fff; }
.av.av-on .av-ng.key { animation: av-core 1.8s ease-out 1; }
/* Dans le HUD (à 24 px du bord), l'onde reste dans l'écran */
.hud-btn.who .av.av-on::after, .avatar.xs.av-on::after, .mo-toast .av.av-on::after { animation-name: av-ring-s; }

/* Petites tailles : pas d'étincelle continue (illisible), seulement à la réaction */
.avatar.xs .av-spark, .hud-btn.who .av-spark, .avp-st .av-spark { animation: none; }
.av.xs.av-on .av-spark { animation: av-run1 1.25s cubic-bezier(.3, 0, .2, 1) 1; }

/* Niveaux d'animation : douces = pas d'étincelle au repos ; minimales et mouvement réduit = rien ne bouge */
html[data-motion="douces"] .av-spark { animation: none; }
html[data-motion="douces"] .av.av-on .av-spark { animation: av-run1 1.6s ease-out 1; }
html[data-motion="douces"] .av-ng { animation-duration: 6s; }
html[data-motion="douces"] .av-orb { animation-duration: 44s; }
html[data-motion="minimales"] .av, html[data-motion="minimales"] .av *, html[data-motion="minimales"] .av::after,
html[data-activity="frozen"] .av *, html[data-activity="frozen"] .av { animation: none !important; }
html[data-motion="minimales"] .av-ng { opacity: .24; }
html[data-motion="minimales"] .av.av-on .av-glow { opacity: .55; }
/* Sans mouvement, la réaction reste franche : un état allumé fixe pendant 1,9 s (la durée de .av-on) */

html[data-motion="minimales"] .av.av-on::after { opacity: 1; transform: none; }
html[data-motion="minimales"] .av.av-on .av-ng { opacity: .5; }

  html:not([data-motion="vivantes"]) .av, html:not([data-motion="vivantes"]) .av *, html:not([data-motion="vivantes"]) .av::before, html:not([data-motion="vivantes"]) .av::after { animation: none !important; }
  html:not([data-motion="vivantes"]) .av.av-on::before { opacity: .55; }
  html:not([data-motion="vivantes"]) .av.av-on::after { opacity: 1; transform: none; }
  html:not([data-motion="vivantes"]) .av.av-on .av-glow { opacity: .55; }
  html:not([data-motion="vivantes"]) .av.av-on .av-ng { opacity: .5; }
}

/* ————— Le sélecteur ————— */
.avp { display: flex; flex-direction: column; gap: 14px; }
.avp-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 4px; max-width: 520px; }
.avp-b { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px 4px; border-radius: 16px; min-height: 44px; color: var(--text-2); transition: background .2s; }
.avp-b .avatar.lg { width: 56px; height: 56px; transition: transform .25s var(--spring, ease); }
.avp-b small { font-size: 12.5px; font-weight: 500; line-height: 1.2; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; color: var(--text); }

.avp-b:active .avatar { transform: scale(.92); }
/* Verrouillé : silhouette lisible mais en retrait ; en clair, pas de trou noir sur la feuille blanche */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avp-b.locked .avatar { filter: saturate(.25) brightness(.62); opacity: 1; } }
:root[data-theme="dark"] .avp-b.locked .avatar { filter: saturate(.25) brightness(.62); opacity: 1; }
.avp-keep { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 500; font-size: var(--fs-meta); align-self: flex-start; }

.avp-st .avatar { width: 46px; height: 46px; }

/* Grand écran : une série tient sur une ligne */
@media (min-width: 640px) { .avp-grid { max-width: none; grid-template-columns: repeat(10, minmax(0, 1fr)); } }

/* Migration : avant → après */
.avmig-head { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px 0 2px; }
.avmig-arrow svg { width: 22px; height: 22px; color: var(--text-3); }

.avmig-intro > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
/* Les deux choix restent à portée de pouce : pied de feuille collant */

/* Message qui porte l'avatar allumé */
.mo-toast.has-icon { display: flex; align-items: center; gap: 12px; padding-left: 12px; width: max-content; }
.mo-toast.has-icon .avatar { flex: 0 0 auto; }

.mo-toast b { font-weight: 600; }

/* Le HUD : le dessin remplit sa pastille (le réglage des icônes à 21 px ne s'applique pas à lui), un seul anneau au repos */
.hud-btn.who:has(.av) { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.hud-btn.who .avatar.av { --av-bg: .38; }
.hud-btn.who .avatar.av.st1, .hud-btn.who .avatar.av.st2, .hud-btn.who .avatar.av.st3, .hud-btn.who .avatar.av.st4 { --av-bg: .48; }
.hud-btn.who .av-fig { transform: scale(1.2); }
.hud-btn.who .ser-t .av-line { stroke-width: 2.4px; }
.hud-btn.who .ser-r .av-line { stroke-width: 3px; }


/* Mode enfant : tuiles plus grandes */
html[data-kid] .avp-b .avatar.lg { width: 66px; height: 66px; }

/* ═════════════ Avatars dessinés (v3) ═════════════
   Vingt avatars en SVG, entièrement dessinés ici (aucune image) : deux registres sur la même grille de 64,
   « Tracés » (12 ans et plus : neurones, sillons, ondes, cristaux, orbites, constellations) et
   « Rondeurs » (3–11 ans : animaux ronds et lumineux). Un trait par registre, le même rendu lumineux pour tous :
   sous-couche floue, nœuds qui battent, une étincelle qui parcourt le tracé.
   L'avatar s'allume quand on termine un exercice et s'habille avec la pratique (anneau de 12 segments,
   puis lueur, halo, orbite, couronne). C'est un décor qui suit les exercices faits, pas une mesure.
   Données : p.av = { id, pal } (pal = id de territoire). p.avatar (emoji) reste affiché tant que p.av est absent. */

/* ——— Petite géométrie ——— */
const avF = (n) => +n.toFixed(2);
const avPoly = (pts, close) => 'M' + pts.map(([x, y]) => `${avF(x)} ${avF(y)}`).join(' L') + (close ? ' Z' : '');
const avRot = (x, y, deg) => { const a = deg * Math.PI / 180; return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]; };
const avEllPt = (cx, cy, rx, ry, rot, t) => { const [x, y] = avRot(rx * Math.cos(t), ry * Math.sin(t), rot); return [avF(cx + x), avF(cy + y)]; };
function avEll(cx, cy, rx, ry, rot = 0) {
  const [x0, y0] = avEllPt(cx, cy, rx, ry, rot, 0), [x1, y1] = avEllPt(cx, cy, rx, ry, rot, Math.PI);
  return `M${x0} ${y0} A${rx} ${ry} ${rot} 1 1 ${x1} ${y1} A${rx} ${ry} ${rot} 1 1 ${x0} ${y0}`;
}
const avCirc = (cx, cy, r) => avEll(cx, cy, r, r, 0);
function avArc(cx, cy, r, a0, a1) {
  const p = (a) => [avF(cx + r * Math.cos((a - 90) * Math.PI / 180)), avF(cy + r * Math.sin((a - 90) * Math.PI / 180))];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}
/* Spirale d'Archimède lissée (coquille, sillon) */
function avSpiral(cx, cy, r0, r1, turns, a0 = 0, steps = 72) {
  const pts = [];
  for (let i = 0; i <= steps; i++) { const t = i / steps, a = a0 + t * turns * Math.PI * 2, r = r0 + (r1 - r0) * t; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return avPoly(pts);
}
const avMirror = (pts) => pts.map(([x, y]) => [64 - x, y]);
const avHex = (cx, cy, r, rot = -90) => Array.from({ length: 6 }, (_, i) => { const a = (rot + i * 60) * Math.PI / 180; return [avF(cx + r * Math.cos(a)), avF(cy + r * Math.sin(a))]; });

/* ——— Les vingt formes ———

/* ——— Le choix : grille, couleurs, aperçu de l'habillage ———

function avPickerClick(e) {

/* ——— Branchement dans l'app (absent de la planche de contrôle autonome) ——— */
if (typeof ACTIONS !== 'undefined' && typeof Motion !== 'undefined') {
  document.addEventListener('click', avPickerClick);
  /* Réaction : l'avatar s'allume quand on termine un exercice, un neurone, une quête */

    else if (st) setTimeout(() => Moves.toast(typo(`Nouveau palier : ${st.name}. ${st.line}`), { color: col }), 3000 / Motion.speed);
    else if (un) setTimeout(() => Moves.toast(typo(`${un.name} est disponible dans Profils.`), { color: avColor(un.pal), icon: avChip(un.id, un.pal, 'xs', { cls: 'av-on', salt: 'un' }) }), 3000 / Motion.speed);

    const keep = kid ? `Tu peux aussi garder ton <span class="avmig-emo">${esc(p.avatar)}</span>.` : esc('Tu peux aussi garder ton avatar actuel, rien ne change si tu préfères.');
    openSheet('avmig', 'Nouveaux avatars', `<div class="avmig-head">${avatarHTML(p, 'lg')}<span class="avmig-arrow" aria-hidden="true">${I.chev || '→'}</span>${avChip(AVP.mig.id, AVP.mig.pal, 'lg', { cls: 'avmig-new', salt: 'mig' })}</div>
      <div class="avmig-intro">${kid && typeof say === 'function' ? say(`${intro} Tu peux aussi garder ton avatar d'avant.`) : ''}<div><p class="lesson-text">${esc(intro)}</p><p class="meta">${keep}</p></div></div>
      ${avPicker('mig')}
      <div class="row-btns avmig-btns"><button class="btn btn-primary" data-act="av-mig-ok">${I.check} Prendre cet avatar</button><button class="btn btn-quiet" data-act="av-mig-keep">Garder mon emoji</button></div>`);
